aid: stessa
name: Stessa
description: >-
  Stessa is a financial reporting, accounting, and management platform for
  rental property owners and small-to-mid-size landlords, headquartered in
  San Francisco and operated as a brand of Roofstock alongside Mynd and
  RentPrep. The platform helps owners track unlimited properties and
  portfolios with automated bank and credit card feeds, transaction
  categorization, mileage tracking, receipt scanning, Schedule E-ready tax
  reporting, online rent collection, tenant screening through RentPrep,
  e-signature leasing with 50+ legal templates, maintenance request
  tracking, and property-specific Stessa Cash Management accounts with
  high-yield APY and FDIC insurance up to $3M per entity. Stessa is
  delivered as a web app and iOS/Android mobile apps with three tiers —
  Essentials (free), Manage, and Pro — and serves more than 350,000
  landlords. Bank, credit card, and payment data flows in through aggregator
  partners (Plaid-style open banking) rather than a public Stessa API,
  and the only developer-facing GitHub presence is an org with a handful
  of forked Ruby and Vue.js utilities. There is no public Stessa REST
  API, no developer portal, no SDKs, and no published webhooks; the
  Stessa community has open feature requests for a public API to pull
  reports and transactions, but none has shipped.
